<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Header</title>
    <style>
      /* Mobile first */
      body {
        margin: 0;
        padding: 0;
      }
      #pageheader {
        background-color: antiquewhite;
      }
      #logo {
        width: 100px;
        height: 100px;
        background-color: lightgray;
        border-radius: 50%;
        border: 2px solid black;
        margin: auto;
      }
      #pageheader nav {
        background-color: rgb(219, 148, 56);
        padding: 1rem;
      }
      #pageheader ul {
        background-color: antiquewhite;
      }
    </style>
  </head>
  <body>
    <header id="pageheader">
      <div id="logo"></div>
      <nav>
        <ul>
          <li>Home</li>
          <li>Why Adopt</li>
          <li>Pet Gallery</li>
          <li>Testimonials</li>
        </ul>
      </nav>
    </header>
  </body>
</html>
